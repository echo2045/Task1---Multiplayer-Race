// GENERATED BY UNITY. You can edit it, Unity will keep most tokens intact.

buildscript {
    repositories {        
        google()
        mavenCentral()
    }
    dependencies {
        // Match Unity's Gradle, but upgrade AGP for Firebase
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath 'com.google.gms:google-services:4.3.15'  // Firebase services
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'com.google.gms.google-services'   // Firebase plugin

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Keep Unity tokens so it injects your dependencies automatically
    implementation(name: 'FirebaseApp.androidlib', ext:'aar')
    implementation(name: 'FirebaseAuth.androidlib', ext:'aar')

    // (Unity will replace this marker with its libraries)
    **DEPS**
}

// Required for Firebase (desugaring + multidex)
android {
	namespace "com.unity3d.player"
	ndkPath "**NDKPATH**"
	aaptOptions {
		noCompress = ['.ress', '.resource', '.obb'] + unityStreamingAssets.tokenize(', ')
		ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
	}

    compileSdkVersion **APIVERSION**

    defaultConfig {
consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**
        minSdkVersion **MINSDKVERSION**
        targetSdkVersion **TARGETSDKVERSION**
        
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    dependencies {
        coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
    }

    packagingOptions {
        exclude 'META-INF/*.kotlin_module'
    }
}
